apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.envConfigMapName" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.envConfig | nindent 2 }}
{{- if .Values.envSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vector.envSecretName" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secretEnvData }}
data:
  {{- toYaml .Values.secretEnvData | nindent 2 }}
{{- end }}
{{- if .Values.secretEnv }}
stringData:
  {{- toYaml .Values.secretEnv | nindent 2 }}
{{- end }}
{{- if and (not .Values.secretEnv) (not .Values.secretEnvData) }}
data: {}
{{- end }}
{{- end }}
{{- if .Values.configMap.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.configMapName" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.config | nindent 2 }}
{{- end }}
{{- if .Values.sourcesConfigMap.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.sourcesConfigMapName" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.sources | nindent 2 }}
{{- end }}
{{- if .Values.transformsConfigMap.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.transformsConfigMapName" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.transforms | nindent 2 }}
{{- end }}
{{- if .Values.sinksConfigMap.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.sinksConfigMapName" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.sinks | nindent 2 }}
{{- end }}
{{- if .Values.scriptsConfigMap.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.scriptsConfigMapName" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.scripts | nindent 2 }}
{{- end }}
{{- if .Values.enrichmentsConfigMap.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.enrichmentsConfigMapName" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.enrichments | nindent 2 }}
{{- end }}
