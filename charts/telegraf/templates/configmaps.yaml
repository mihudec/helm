{{- if .Values.envConfigMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telegraf.envConfigMapName" . }}
  labels:
    {{- include "telegraf.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.envConfig | nindent 2 }}
{{- end }}
{{- if .Values.envSecret.create }}
{{- if .Values.envConfigMap.create }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telegraf.envSecretName" . }}
  labels:
    {{- include "telegraf.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secretEnvData }}
data:
  {{- toYaml .Values.secretEnvData | nindent 2 }}
{{- end }}
{{- if .Values.secretEnv }}
stringData:
  {{- toYaml .Values.secretEnv | nindent 2 }}
{{- end }}
{{- if and (not .Values.secretEnv) (not .Values.secretEnvData) }}
data: {}
{{- end }}
{{- end }}
